<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventShaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F8;--card:#fff;--ink:#14182F;--mute:#5A6078;--line:#DDE1EB;--brand:#2B2F77;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1224;--card:#191D38;--ink:#EEF0FA;--mute:#A3A9C4;--line:#2B3157;--brand:#8E96FF;color-scheme:dark}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;flex-wrap:wrap}
nav b{display:flex;align-items:center;gap:10px;font:800 22px 'Bricolage Grotesque',sans-serif;cursor:pointer}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:14px}.btn.red{background:#B3261E}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #F5B301;outline-offset:2px}
.banner{border-radius:22px;padding:44px 30px;margin:8px 0 28px;color:#fff;background:linear-gradient(120deg,#2B2F77,#B4235A 55%,#E8830C)}
.banner h1{font-size:clamp(32px,6vw,58px);font-weight:800}
.banner p{max-width:520px;margin:12px 0 0;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.club{background:var(--card);border-radius:16px;padding:18px;cursor:pointer;border:1px solid var(--line);border-top:6px solid var(--c)}
.logo{display:block;width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:10px}.logo.big{height:150px;max-width:300px}
.club h3{font-size:19px;margin:4px 0 4px}.club small,.mute{color:var(--mute)}
.club:hover{border-color:var(--c)}
h2{font-size:26px;margin:30px 0 14px}
.ev{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px;margin-bottom:12px}
.ev h3{font-size:19px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:6px 6px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg)}
.modal{position:fixed;inset:0;background:#000A;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
.modal .box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:480px;margin:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-weight:700}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
footer{padding:30px 0 40px;color:var(--mute);font-size:14px}
</style>
</head>

const $=s=>document.querySelector(s);

const today=()=>new Date().toISOString().slice(0,10);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function modal(html){$('#layer').innerHTML='<div class="modal" onclick="if(event.target===this)closeM()"><div class="box">'+html+'</div></div>'}
function closeM(){$('#layer').innerHTML=''}

function nav(){
 $('#navr').innerHTML=me?`<span class="mute">${me.role==='admin'?'Main Admin':esc(club(me.clubId).name)+' faculty'}</span> <button class="btn sm" onclick="go('dash')">Dashboard</button> <button class="btn sm ghost" onclick="logout()">Logout</button>`
 :`<button class="btn sm" onclick="loginM()">Faculty / Admin login</button>`;
}
function go(v,id){nav();({home,club:clubPage,dash:dash})[v](id);window.scrollTo(0,0)}
$('#logo').onclick=()=>go('home');

function eventCard(e,showClub){
 const c=club(e.clubId),n=count(e.id),full=n>=e.seats,closed=e.last<today();
 return `<div class="ev" style="--c:${c.color}"><div class="row"><div><h3>${esc(e.title)}</h3>${showClub?`<small class="mute">${esc(c.name)}</small>`:''}</div>
 ${closed?'<span class="chip">Registration band</span>':full?'<span class="chip">Seats full</span>':`<button class="btn sm" onclick="regM(${e.id})">Register</button>`}</div>
 <p>${esc(e.desc)}</p>${e.note?`<p><b>Zaruri:</b> ${esc(e.note)}</p>`:''}
 <span class="chip">${fdate(e.date)}, ${esc(e.time)}</span><span class="chip">${esc(e.venue)}</span><span class="chip">${e.type==='Team'?'Team of '+e.team:'Solo'}</span><span class="chip">${n}/${e.seats} seats bhar gayi</span><span class="chip">Last date: ${fdate(e.last)}</span></div>`;
}
function home(){
 $('#app').innerHTML=`<div class="banner"><h1>Club Launching</h1><p>Hamare college ke 7 naye clubs ab shuru. Apna club chuno, events dekho aur register karo.</p></div>
 <h2>Hamare clubs</h2><div class="grid">${db.clubs.map(c=>`<div class="club" style="--c:${c.color}" onclick="go('club',${c.id})" tabindex="0" onkeydown="if(event.key==='Enter')go('club',${c.id})">${logo(c)}<h3>${esc(c.name)}</h3><small>${esc(c.tag)}</small><p>${esc(c.intro)}</p><p style="font-size:14px;margin:0 0 8px"><b>${esc(c.fname)}</b><br>${esc(c.fphone)}</p><small>${db.events.filter(e=>e.clubId==c.id).length} events</small></div>`).join('')}</div>
 <h2>Aane wale events</h2>${db.events.length?[...db.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>eventCard(e,true)).join(''):'<p class="mute">Abhi koi event nahi hai.</p>'}`;
}
function clubPage(id){
 const c=club(id),ev=db.events.filter(e=>e.clubId==id);
 $('#app').innerHTML=`<button class="btn ghost sm" onclick="go('home')">Wapas</button>

 <h2>${esc(c.name)} ke events</h2>${ev.length?ev.map(e=>eventCard(e)).join(''):'<p class="mute">Is club ka abhi koi event nahi hai.</p>'}`;
}

 <div><label>Branch aur year</label><input id="r_branch" placeholder="CSE, 2nd year"></div><div><label>Institute</label><select id="r_inst"><option>MIST</option><option>MIPS</option></select></div><div><label>Gender</label><select id="r_gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
 <div><label>Email</label><input id="r_email" type="email"></div><div><label>Phone</label><input id="r_phone" type="tel"></div>${team}</div>
 <p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="doReg(${id})">Register karo</button></p>`);
}
function doReg(id){
 const e=db.events.find(x=>x.id==id),v=k=>($('#r_'+k)?.value||'').trim();
 const r={id:Date.now(),eventId:id,name:v('name'),roll:v('roll'),branch:v('branch'),inst:v('inst'),gender:v('gender'),email:v('email'),phone:v('phone'),team:v('team').replace(/\n/g,', ')};
 if(!r.name||!r.roll||!r.email||!r.phone)return toast('Naam, roll, email aur phone zaruri hain');
 if(count(id)>=e.seats)return toast('Seats full ho gayi');
 if(e.last<today())return toast('Registration band ho chuka hai');
 if(db.regs.some(x=>x.eventId==id&&x.roll.toLowerCase()===r.roll.toLowerCase()))return toast('Is roll number se pehle hi register ho chuka hai');
 db.regs.push(r);save();closeM();toast('Registration ho gaya!');go('home');
}
function loginM(){
 modal(`<h2 style="margin-top:0">Login</h2><div class="f" style="grid-template-columns:1fr"><div><label>Username</label><input id="l_u" autocomplete="username"></div><div><label>Password</label><input id="l_p" type="password" autocomplete="current-password"></div></div>
 <p class="mute" style="font-size:14px">Demo: admin / admin123 &nbsp;|&nbsp; faculty: brainwave / 1234 (ya rhythm, innovation, litfusion, sports, artcraft, media)</p>
 <p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="login()">Login</button></p>`);
}
function login(){
 const u=$('#l_u').value.trim().toLowerCase(),p=$('#l_p').value;
 if(u==='admin'&&p==='admin123')me={role:'admin'};
 else{const c=db.clubs.find(c=>c.fuser===u&&c.fpass===p);if(!c)return toast('Username ya password galat hai');me={role:'faculty',clubId:c.id}}
 closeM();toast('Login ho gaya');go('dash');
}
function logout(){me=null;go('home')}

function dash(){
 if(!me)return go('home');
 let h='';
 if(me.role==='faculty'){
  const c=club(me.clubId);
  h+=`<h1 style="font-size:32px">${esc(c.name)} dashboard</h1><p class="mute">Aap sirf apne club ke events badal sakte hain.</p>
  <div class="panel"><h3>Naya event jodein</h3><div class="f" style="margin-top:10px">
  <div><label>Event ka naam</label><input id="e_title"></div><div><label>Date</label><input id="e_date" type="date"></div><div><label>Time</label><input id="e_time" type="time"></div>
  <div><label>Venue</label><input id="e_venue"></div><div><label>Registration last date</label><input id="e_last" type="date"></div><div><label>Kitne students (seats)</label><input id="e_seats" type="number" min="1"></div>
  <div><label>Type</label><select id="e_type"><option>Solo</option><option>Team</option></select></div><div><label>Team me kitne members</label><input id="e_team" type="number" min="1" value="1"></div>
  <div style="grid-column:1/-1"><label>Kya kya activities hain</label><textarea id="e_desc" rows="3"></textarea></div><div style="grid-column:1/-1"><label>Kya laana hai / dress code / note</label><input id="e_note" placeholder="Jaise: College ID card, sports shoes"></div></div>
  <p style="margin-bottom:0"><button class="btn" onclick="addEv()">Event save karo</button></p></div>`;
  h+=evTable(db.events.filter(e=>e.clubId==me.clubId));
 }else{
  h+=`<h1 style="font-size:32px">Main admin</h1><p class="mute">Clubs aur faculty ki detail yahan badlein.</p>`;
  h+=db.clubs.map(c=>`<div class="panel" style="border-left:6px solid ${c.color}"><div class="f">
  <div><label>Club ka naam</label><input id="c${c.id}_name" value="${esc(c.name)}"></div><div><label>Tag</label><input id="c${c.id}_tag" value="${esc(c.tag)}"></div>
  <div><label>Faculty ke naam (kai ho to comma se)</label><input id="c${c.id}_fname" value="${esc(c.fname)}"></div><div><label>Faculty ka number</label><input id="c${c.id}_fphone" value="${esc(c.fphone)}"></div>
  <div><label>Login username</label><input id="c${c.id}_fuser" value="${esc(c.fuser)}"></div><div><label>Login password</label><input id="c${c.id}_fpass" value="${esc(c.fpass)}"></div>
  <div style="grid-column:1/-1"><label>Intro</label><input id="c${c.id}_intro" value="${esc(c.intro)}"></div></div>
  <p style="margin-bottom:0"><button class="btn sm" onclick="saveClub(${c.id})">Save</button></p></div>`).join('');
  h+=evTable(db.events,true)+`<p><button class="btn red sm" onclick="if(confirm('Saara data demo data se badal jayega. Pakka?')){db=seed();save();go('dash')}">Demo data reset</button></p>`;
 }
 $('#app').innerHTML=h;
}
function evTable(list,all){
 return `<h2>${all?'Saare events':'Mere events'}</h2>`+(list.length?list.map(e=>{
  const rs=db.regs.filter(r=>r.eventId==e.id);
  return `<div class="panel"><div class="row"><div><h3>${esc(e.title)}</h3><small class="mute">${all?esc(club(e.clubId).name)+' · ':''}${fdate(e.date)} · ${rs.length}/${e.seats} registrations</small></div>
  <div><button class="btn sm ghost" onclick="csv(${e.id})">CSV download</button> <button class="btn sm" onclick="editM(${e.id})">Edit</button> <button class="btn sm red" onclick="delEv(${e.id})">Delete</button></div></div>
  ${rs.length?`<div class="scroll"><table><tr><th>Naam</th><th>Roll</th><th>Branch</th><th>Institute</th><th>Gender</th><th>Email</th><th>Phone</th><th>Team</th></tr>${rs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.roll)}</td><td>${esc(r.branch)}</td><td>${esc(r.inst)}</td><td>${esc(r.gender)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.team)}</td></tr>`).join('')}</table></div>`:'<p class="mute" style="margin-bottom:0">Abhi koi registration nahi.</p>'}</div>`}).join(''):'<p class="mute">Abhi koi event nahi.</p>');
}
// Ownership check: faculty sirf apne club ka event badal sakta hai (admin sab)
const canEdit=e=>me&&(me.role==='admin'||(me.role==='faculty'&&e.clubId==me.clubId));
function addEv(){
 if(!me||me.role!=='faculty')return;
 const v=k=>$('#e_'+k).value.trim();
 const e={id:Date.now(),clubId:me.clubId,title:v('title'),desc:v('desc'),note:v('note'),date:v('date'),time:v('time'),venue:v('venue'),last:v('last'),seats:parseInt(v('seats'))||0,type:v('type'),team:parseInt(v('team'))||1};
 if(!e.title||!e.date||!e.venue||!e.last||e.seats<1)return toast('Naam, date, venue, last date aur seats bharein');
 db.events.push(e);save();toast('Event jud gaya');dash();
}
function editM(id){
 const e=db.events.find(x=>x.id==id);
 if(!e||!canEdit(e))return toast('Aap dusre club ka event nahi badal sakte');
 const f=(k,l,t,v)=>`<div><label>${l}</label><input id="x_${k}" type="${t}" value="${esc(v)}"></div>`;
 modal(`<h2 style="margin-top:0">Event edit karo</h2><div class="f" style="grid-template-columns:1fr">`
 +f('title','Event ka naam','text',e.title)+f('date','Date','date',e.date)+f('time','Time','time',e.time)+f('venue','Venue','text',e.venue)+f('last','Registration last date','date',e.last)+f('seats','Seats','number',e.seats)
 +`<div><label>Type</label><select id="x_type"><option${e.type==='Solo'?' selected':''}>Solo</option><option${e.type==='Team'?' selected':''}>Team</option></select></div>`
 +f('team','Team me kitne members','number',e.team)
 +`<div><label>Activities</label><textarea id="x_desc" rows="3">${esc(e.desc)}</textarea></div>`+f('note','Kya laana hai / note','text',e.note||'')
 +`</div><p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveEv(${id})">Save</button></p>`);
}
function saveEv(id){
 const e=db.events.find(x=>x.id==id);
 if(!e||!canEdit(e))return toast('Aap dusre club ka event nahi badal sakte');
 const v=k=>$('#x_'+k).value.trim(),seats=parseInt(v('seats'))||0;
 if(!v('title')||!v('date')||!v('venue')||!v('last'))return toast('Naam, date, venue aur last date bharein');
 if(seats<count(id))return toast('Seats '+count(id)+' se kam nahi ho sakti, itne log register ho chuke hain');
 Object.assign(e,{title:v('title'),date:v('date'),time:v('time'),venue:v('venue'),last:v('last'),seats,type:v('type'),team:parseInt(v('team'))||1,desc:v('desc'),note:v('note')});
 save();closeM();toast('Event update ho gaya');go('dash');
}
function delEv(id){
 const e=db.events.find(x=>x.id==id);
 if(!e||!canEdit(e))return toast('Aap dusre club ka event nahi badal sakte');
 if(!confirm('Event aur uski registrations delete ho jayengi. Pakka?'))return;
 db.events=db.events.filter(x=>x.id!=id);db.regs=db.regs.filter(r=>r.eventId!=id);save();dash();
}
function saveClub(id){
 if(!me||me.role!=='admin')return;
 const c=club(id);['name','tag','fname','fphone','fuser','fpass','intro'].forEach(k=>c[k]=$('#c'+id+'_'+k).value.trim());
 save();toast('Club save ho gaya');
}
function csv(id){
 const e=db.events.find(x=>x.id==id);if(!e||!canEdit(e))return;
 const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
 const rows=[['Naam','Roll','Branch','Institute','Gender','Email','Phone','Team'],...db.regs.filter(r=>r.eventId==id).map(r=>[r.name,r.roll,r.branch,r.inst,r.gender,r.email,r.phone,r.team])];
 const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=e.title+'.csv';a.click();
}
go('home');
</script>
</body>
</html>
