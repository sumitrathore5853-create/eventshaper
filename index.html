<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventShaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F8;--card:#fff;--ink:#14182F;--mute:#5A6078;--line:#DDE1EB;--brand:#2B2F77;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1224;--card:#191D38;--ink:#EEF0FA;--mute:#A3A9C4;--line:#2B3157;--brand:#8E96FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1224;--card:#191D38;--ink:#EEF0FA;--mute:#A3A9C4;--line:#2B3157;--brand:#8E96FF;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;flex-wrap:wrap}
nav b{display:flex;align-items:center;gap:10px;font:800 22px 'Bricolage Grotesque',sans-serif;cursor:pointer}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:14px}.btn.red{background:#B3261E}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #F5B301;outline-offset:2px}
.banner{border-radius:22px;padding:44px 30px;margin:8px 0 28px;color:#fff;background:linear-gradient(120deg,#2B2F77,#B4235A 55%,#E8830C)}
.banner h1{font-size:clamp(32px,6vw,58px);font-weight:800}
.banner p{max-width:520px;margin:12px 0 0;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.club{background:var(--card);border-radius:16px;padding:18px;cursor:pointer;border:1px solid var(--line);border-top:6px solid var(--c)}
.hero{display:block;width:100%;height:auto;border-radius:22px;margin:8px 0 28px}
.logo{display:block;width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:10px}.logo.big{height:150px;max-width:300px}
.club h3{font-size:19px;margin:4px 0 4px}.club small,.mute{color:var(--mute)}
.club:hover{border-color:var(--c)}
h2{font-size:26px;margin:30px 0 14px}
.ev{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px;margin-bottom:12px}
.ev h3{font-size:19px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:6px 6px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg)}
.modal{position:fixed;inset:0;background:#000A;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
.modal .box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:480px;margin:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-weight:700}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
footer{padding:30px 0 40px;color:var(--mute);font-size:14px}
</style>
</head>

function applyPrefs(){
 const r=document.documentElement;
 if(prefs.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',prefs.theme);

function readImg(f,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.65))};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(f)})}

function galM(){
 const c=club(me.clubId),g=c.gallery||[];
 modal(`<h2 style="margin-top:0">Club gallery</h2><div class="f" style="grid-template-columns:1fr"><div><label>Purani photos jodo</label><input type="file" accept="image/*" multiple onchange="addPhotos(this)"></div><div><label>Video ka link (YouTube ya Drive)</label><input id="g_url" placeholder="https://..."></div></div><p><button class="btn sm" onclick="addVid()">Video link jodo</button></p>`+(g.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${g.map((x,i)=>`<div>${x.t==='p'?`<img class="logo" style="height:80px;object-fit:cover" src="${x.s}" alt="">`:'<div class="panel" style="padding:8px;font-size:13px">Video</div>'}<button class="btn sm red" onclick="delG(${i})">Hatao</button></div>`).join('')}</div>`:'<p class="mute">Abhi kuch nahi joda.</p>')+`<p style="text-align:right"><button class="btn" onclick="closeM()">Done</button></p>`);
}
async function addPhotos(inp){
 if(!me||me.role!=='faculty')return;
 const c=club(me.clubId);c.gallery=c.gallery||[];
 for(const f of inp.files){const d=await readImg(f,640);if(d)c.gallery.push({t:'p',s:d})}
 save();galM();
}
function addVid(){
 if(!me||me.role!=='faculty')return;
 const u=$('#g_url').value.trim();
 if(!(u.startsWith('http://')||u.startsWith('https://')))return toast('Sahi link daalo (https:// se shuru)');
 const c=club(me.clubId);c.gallery=c.gallery||[];c.gallery.push({t:'v',s:u});save();galM();
}
function delG(i){if(!me||me.role!=='faculty')return;club(me.clubId).gallery.splice(i,1);save();galM()}
function detM(){
 const c=club(me.clubId),n=c.fstatus==='pending'?'':c.fname;
 modal(`<h2 style="margin-top:0">Meri details</h2><p class="mute">Admin ke approve karne ke baad ye club page par dikhengi.</p><div class="f" style="grid-template-columns:1fr"><div><label>Naam</label><input id="d_name" value="${esc(n)}"></div><div><label>Phone</label><input id="d_phone" value="${esc(c.fphone)}"></div><div><label>Naya password (optional)</label><input id="d_pass" type="password"></div></div><p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="sendDet()">Admin ko bhejo</button></p>`);
}
function sendDet(){
 if(!me||me.role!=='faculty')return;
 const c=club(me.clubId),n=$('#d_name').value.trim(),p=$('#d_phone').value.trim();
 if(!n||!p)return toast('Naam aur phone bharein');
 c.pending={fname:n,fphone:p,fpass:$('#d_pass').value};c.fstatus='review';save();closeM();toast('Admin ko bhej di');
}
function apprM(){
 const l=db.clubs.filter(c=>c.fstatus==='review');
 modal(`<h2 style="margin-top:0">Approval</h2>`+(l.length?l.map(c=>`<div class="panel"><b>${esc(c.name)}</b><p>${esc(c.pending.fname)}<br>${esc(c.pending.fphone)}</p><button class="btn sm" onclick="decide(${c.id},1)">Haan, approve</button> <button class="btn sm red" onclick="decide(${c.id},0)">Reject</button></div>`).join(''):'<p class="mute">Approve karne ke liye koi details nahi hain.</p>')+`<p style="text-align:right"><button class="btn" onclick="closeM()">Done</button></p>`);
}
function decide(id,ok){
 if(!me||me.role!=='admin')return;
 const c=club(id),p=c.pending;
 if(ok&&p){c.fname=p.fname;c.fphone=p.fphone;if(p.fpass)c.fpass=p.fpass;c.fstatus='ok'}else c.fstatus=c.fname==='Details jald aayengi'?'pending':'ok';
 delete c.pending;save();apprM();toast(ok?'Approve ho gaya':'Reject kiya');
}
function clubM(){
 const f=(k,l,t)=>`<div><label>${l}</label><input id="n_${k}" type="${t}"></div>`;
 modal(`<h2 style="margin-top:0">Naya club</h2><div class="f" style="grid-template-columns:1fr">`+f('name','Club ka naam','text')+f('tag','Tag (jaise Dance Club)','text')+f('intro','Intro','text')+`<div><label>Rang</label><input id="n_color" type="color" value="#2B2F77"></div>`+f('user','Faculty username','text')+f('pass','Faculty temporary password','text')+`</div><p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="addClub()">Club banao</button></p>`);
}
function addClub(){
 if(!me||me.role!=='admin')return;
 const v=k=>$('#n_'+k).value.trim(),u=v('user').toLowerCase();
 if(!v('name')||!u||!v('pass'))return toast('Naam, username aur password bharein');
 if(db.clubs.some(c=>c.fuser===u)||u==='admin')return toast('Ye username pehle se hai');
 db.clubs.push({id:Date.now(),name:v('name'),tag:v('tag'),color:v('color'),intro:v('intro'),fname:'Details jald aayengi',fphone:'',fuser:u,fpass:v('pass'),fstatus:'pending',gallery:[]});
 save();closeM();toast('Naya club ban gaya');go('home');
}
function facM(){
 modal(`<h2 style="margin-top:0">Faculty jodo</h2><div class="f" style="grid-template-columns:1fr"><div><label>Club</label><select id="f_club">${db.clubs.filter(c=>c.fstatus==='pending').map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div><label>Faculty username</label><input id="f_user"></div><div><label>Temporary password</label><input id="f_pass"></div></div><p class="mute">Faculty login karke apni details bharegi, phir aap approve karoge. Sirf naye club ke liye, jiska faculty abhi tak nahi juda. Purane clubs ke faculty nahi badlenge.</p><p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="addFac()">Jodo</button></p>`);
}
function addFac(){
 if(!me||me.role!=='admin')return;
 const c=club($('#f_club').value)||{},u=$('#f_user').value.trim().toLowerCase(),p=$('#f_pass').value;
 if(!u||!p)return toast('Username aur password bharein');
 if(db.clubs.some(x=>x.fuser===u&&x.id!==c.id)||u==='admin')return toast('Ye username pehle se hai');
 if(c.fstatus!=='pending')return toast('Sirf naye club me faculty jod sakte ho');
 Object.assign(c,{fuser:u,fpass:p,fstatus:'pending',fname:'Details jald aayengi',fphone:''});delete c.pending;
 save();closeM();toast('Faculty jud gaya');
}
function evM(){
 const f=(k,l,t)=>`<div><label>${l}</label><input id="e_${k}" type="${t}"></div>`;
 modal(`<h2 style="margin-top:0">Naya event</h2><div class="f" style="grid-template-columns:1fr"><div><label>Club</label><select id="e_club">${db.clubs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>`+f('title','Event ka naam','text')+f('date','Date','date')+f('time','Time','time')+f('venue','Venue','text')+f('last','Registration last date','date')+f('seats','Seats','number')+`<div><label>Type</label><select id="e_type"><option>Solo</option><option>Team</option></select></div>`+f('team','Team me kitne members','number')+`<div><label>Activities</label><textarea id="e_desc" rows="3"></textarea></div>`+f('note','Kya laana hai / note','text')+`<div><label>Photo (optional)</label><input type="file" accept="image/*" onchange="pickImg(this)"></div><div><label>Event password</label><input id="e_pw"></div></div><p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="addEv()">Save</button></p>`);
}
const unlocked={};
const unl=e=>me&&(me.role==='admin'||unlocked[e.id]===true);
const lockBox=e=>`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="pw_${e.id}" type="password" placeholder="Is event ka password" style="max-width:240px"><button class="btn sm" onclick="unlock(${e.id})">Registrations kholo</button></div>`;
function unlock(id){
 const e=db.events.find(x=>x.id==id);
 if(!e||!canEdit(e))return toast('Aap dusre club ka event nahi khol sakte');
 if($('#pw_'+id).value===e.pw){unlocked[id]=true;dash()}else toast('Password galat hai');
}
function setReg(id,s){
 const r=db.regs.find(x=>x.id==id),e=r&&db.events.find(x=>x.id==r.eventId);
 if(!r||!e||!canEdit(e))return toast('Aap ye registration nahi badal sakte');
 if(!unl(e))return toast('Pehle event ka password daalo');
 r.status=s;save();toast(s==='accepted'?'Registration accept ho gayi':'Registration cancel ho gayi');dash();
}
const stTxt=s=>({accepted:'Accept ho gayi',cancelled:'Cancel ho gayi'}[s]||'Intezar (pending)');
function regCard(r){
 const e=db.events.find(x=>x.id==r.eventId),c=e&&club(e.clubId);
 return `<div class="panel"><b>${esc(e?e.title:'Event')}</b><br><small class="mute">${esc(c?c.name:'')} | ${e?fdate(e.date):''}</small><p style="margin:8px 0">Status: <b>${esc(stTxt(r.status))}</b></p><div class="mute" style="font-size:14px">Naam: ${esc(r.name)}<br>Roll: ${esc(r.roll)}<br>Branch: ${esc(r.branch)} | ${esc(r.inst)} | ${esc(r.gender)}<br>Email: ${esc(r.email)}<br>Phone: ${esc(r.phone)}${r.team?'<br>Team: '+esc(r.team):''}</div></div>`;
}
function confirmM(r){
 modal(`<h2 style="margin-top:0">Registration bhej di gayi</h2><p class="mute">Faculty ya admin ke accept karne par status badlega. Status "Meri registrations" me dekh sakte ho.</p>${regCard(r)}<p style="text-align:right;margin-bottom:0"><button class="btn" onclick="closeM();go('home')">Done</button></p>`);
}
function myM(){
 modal(`<h2 style="margin-top:0">Meri registrations</h2><div class="f" style="grid-template-columns:1fr"><div><label>Roll number</label><input id="m_roll"></div><div><label>Phone number</label><input id="m_phone" type="tel"></div></div><p><button class="btn" onclick="myShow()">Dekho</button></p><div id="m_out"></div><p style="text-align:right;margin-bottom:0"><button class="btn ghost" onclick="closeM()">Band karo</button></p>`);
}
function myShow(){
 const ro=$('#m_roll').value.trim().toLowerCase(),ph=$('#m_phone').value.replace(/\D/g,'');
 if(!ro||!ph)return toast('Roll aur phone dono bharein');
 const l=db.regs.filter(r=>r.roll.toLowerCase()===ro&&r.phone.replace(/\D/g,'')===ph);
 $('#m_out').innerHTML=l.length?l.map(r=>regCard(r)).join(''):'<p class="mute">Is roll aur phone se koi registration nahi mili.</p>';
}
function nav(){
 $('#navr').innerHTML=me?`<span class="mute">${me.role==='admin'?'Main Admin':esc(club(me.clubId).name)+' faculty'}</span> <button class="btn sm" onclick="go('dash')">Dashboard</button> <button class="btn sm ghost" onclick="myM()">Meri registrations</button> <button class="btn sm ghost" onclick="settingsM()">Settings</button> <button class="btn sm ghost" onclick="logout()">Logout</button>`
 :`<button class="btn sm ghost" onclick="myM()">Meri registrations</button> <button class="btn sm ghost" onclick="settingsM()">Settings</button> <button class="btn sm" onclick="loginM()">Faculty / Admin login</button>`;
}
function go(v,id){nav();({home,club:clubPage,dash:dash})[v](id);window.scrollTo(0,0)}
$('#logo').onclick=()=>go('home');

function eventCard(e,showClub){
 const c=club(e.clubId),n=count(e.id),full=n>=e.seats,closed=e.last<today();
 return `<div class="ev" style="--c:${c.color}"><div class="row"><div><h3>${esc(e.title)}</h3>${showClub?`<small class="mute">${esc(c.name)}</small>`:''}</div>
 ${closed?'<span class="chip">Registration band</span>':full?'<span class="chip">Seats full</span>':`<button class="btn sm" onclick="regM(${e.id})">Register</button>`}</div>
 ${e.img?`<img class="logo" style="height:170px;object-fit:cover;margin:6px 0 10px" src="${e.img}" alt="${esc(e.title)} photo">`:''}<p>${esc(e.desc)}</p>${e.note?`<p><b>Zaruri:</b> ${esc(e.note)}</p>`:''}
 <span class="chip">${fdate(e.date)}, ${esc(e.time)}</span><span class="chip">${esc(e.venue)}</span><span class="chip">${e.type==='Team'?'Team of '+e.team:'Solo'}</span><span class="chip">${n}/${e.seats} seats bhar gayi</span><span class="chip">Last date: ${fdate(e.last)}</span></div>`;
}
function home(){
 $('#app').innerHTML=`<img class="hero" src="${HERO2}" alt="EventShaper: College Event Management. Discover campus events, connect with your community, and make every moment memorable."><div class="panel"><h2 style="margin:0 0 8px">What is EventShaper?</h2><p style="margin:0">EventShaper brings the events of all 7 college clubs into one place. Students pick a club, browse its events and register online. Faculty coordinators manage their own club's events and accept or cancel registrations. The admin oversees clubs and faculty.</p></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:8px"><div class="panel" style="border-top:6px solid #0B7CC4;margin:0"><b>Student</b><p class="mute" style="margin:6px 0 0">Browse events, fill the registration form and check your status under Meri registrations.</p></div><div class="panel" style="border-top:6px solid #0E8F6B;margin:0"><b>Faculty</b><p class="mute" style="margin:6px 0 0">Add or edit your club's events, open registrations with the event password, and accept or cancel them.</p></div><div class="panel" style="border-top:6px solid #B4235A;margin:0"><b>Admin</b><p class="mute" style="margin:6px 0 0">Add new clubs, faculty and events, and approve faculty details.</p></div></div><h2>Club Launching</h2><img class="hero" src="${HERO}" alt="Club Launching: Hamare college ke 7 naye clubs ab shuru. Apna club chuno, events dekho aur register karo.">
 <h2>Hamare clubs</h2><div class="grid">${db.clubs.map(c=>`<div class="club" style="--c:${c.color}" onclick="go('club',${c.id})" tabindex="0" onkeydown="if(event.key==='Enter')go('club',${c.id})">${logo(c)}<h3>${esc(c.name)}</h3><small>${esc(c.tag)}</small><p>${esc(c.intro)}</p><p style="font-size:14px;margin:0 0 8px"><b>${esc(c.fname)}</b><br>${esc(c.fphone)}</p><small>${db.events.filter(e=>e.clubId==c.id).length} events</small></div>`).join('')}</div>
 <h2>Aane wale events</h2>${db.events.length?[...db.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>eventCard(e,true)).join(''):'<p class="mute">Abhi koi event nahi hai.</p>'}`;
}
function clubPage(id){
 const c=club(id),ev=db.events.filter(e=>e.clubId==id);
 $('#app').innerHTML=`<button class="btn ghost sm" onclick="go('home')">Wapas</button>
 <div class="panel" style="border-top:6px solid ${c.color};margin-top:12px">${logo(c,'big')}<h1 style="font-size:34px">${esc(c.name)}</h1><p class="mute">${esc(c.tag)}</p><p>${esc(c.intro)}</p>
 <p><b>Faculty coordinator:</b> ${esc(c.fname)}<br><b>Contact:</b> ${esc(c.fphone)}</p></div>
 <h2>${esc(c.name)} ke events</h2>${ev.length?ev.map(e=>eventCard(e)).join(''):'<p class="mute">Is club ka abhi koi event nahi hai.</p>'}${gal(c)}`;
}
function regM(id){
 const e=db.events.find(x=>x.id==id);
 const team=e.type==='Team'?`<div><label>Team members ke naam (${e.team-1} aur)</label><textarea id="r_team" rows="2" placeholder="Har naam alag line me"></textarea></div>`:'';
 modal(`<h2 style="margin-top:0">${esc(e.title)}</h2><div class="f" style="grid-template-columns:1fr">
 <div><label>Naam</label><input id="r_name"></div><div><label>Roll number</label><input id="r_roll"></div>
 <div><label>Branch aur year</label><input id="r_branch" placeholder="CSE, 2nd year"></div><div><label>Institute</label><select id="r_inst"><option>MIST</option><option>MIPS</option></select></div><div><label>Gender</label><select id="r_gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
 <div><label>Email</label><input id="r_email" type="email"></div><div><label>Phone</label><input id="r_phone" type="tel"></div>${team}</div>
 <p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="doReg(${id})">Register karo</button></p>`);
}
function doReg(id){
 const e=db.events.find(x=>x.id==id),v=k=>($('#r_'+k)?.value||'').trim();
 const r={id:Date.now(),eventId:id,name:v('name'),roll:v('roll'),branch:v('branch'),inst:v('inst'),gender:v('gender'),email:v('email'),phone:v('phone'),team:v('team').replace(/\n/g,', ')};
 if(!r.name||!r.roll||!r.email||!r.phone)return toast('Naam, roll, email aur phone zaruri hain');
 if(count(id)>=e.seats)return toast('Seats full ho gayi');
 if(e.last<today())return toast('Registration band ho chuka hai');
 if(db.regs.some(x=>x.eventId==id&&x.status!=='cancelled'&&x.roll.toLowerCase()===r.roll.toLowerCase()))return toast('Is roll number se pehle hi register ho chuka hai');
 r.status='pending';db.regs.push(r);if(save())confirmM(r);
}
function loginM(){
 modal(`<h2 style="margin-top:0">Login</h2><div class="f" style="grid-template-columns:1fr"><div><label>Username</label><input id="l_u" autocomplete="username"></div><div><label>Password</label><input id="l_p" type="password" autocomplete="current-password"></div></div>
 <p class="mute" style="font-size:14px">Demo: admin / admin123 &nbsp;|&nbsp; faculty: brainwave / 1234 (ya rhythm, innovation, litfusion, sports, artcraft, media)</p>
 <p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="login()">Login</button></p>`);
}
function login(){
 const u=$('#l_u').value.trim().toLowerCase(),p=$('#l_p').value;
 if(u==='admin'&&p==='admin123')me={role:'admin'};
 else{const c=db.clubs.find(c=>c.fuser===u&&c.fpass===p);if(!c)return toast('Username ya password galat hai');me={role:'faculty',clubId:c.id}}
 closeM();toast('Login ho gaya');go('dash');
}
function logout(){me=null;Object.keys(unlocked).forEach(k=>delete unlocked[k]);go('home')}

function dash(){
 if(!me)return go('home');
 let h='';
 if(me.role==='faculty'){
  const c=club(me.clubId);
  h+=`<h1 style="font-size:32px">${esc(c.name)} dashboard</h1><p class="mute">Aap sirf apne club ke events badal sakte hain.</p>
  <div class="panel"><h3>Naya event jodein</h3><div class="f" style="margin-top:10px">
  <div><label>Event ka naam</label><input id="e_title"></div><div><label>Date</label><input id="e_date" type="date"></div><div><label>Time</label><input id="e_time" type="time"></div>
  <div><label>Venue</label><input id="e_venue"></div><div><label>Registration last date</label><input id="e_last" type="date"></div><div><label>Kitne students (seats)</label><input id="e_seats" type="number" min="1"></div>
  <div><label>Type</label><select id="e_type"><option>Solo</option><option>Team</option></select></div><div><label>Team me kitne members</label><input id="e_team" type="number" min="1" value="1"></div>
  <div style="grid-column:1/-1"><label>Kya kya activities hain</label><textarea id="e_desc" rows="3"></textarea></div><div style="grid-column:1/-1"><label>Kya laana hai / dress code / note</label><input id="e_note" placeholder="Jaise: College ID card, sports shoes"></div><div style="grid-column:1/-1"><label>Event ki photo (optional)</label><input type="file" accept="image/*" onchange="pickImg(this)"></div><div style="grid-column:1/-1"><label>Event password (registrations dekhne ke liye)</label><input id="e_pw" placeholder="Jaise: brain2026"></div></div>
  <p style="margin-bottom:0"><button class="btn" onclick="addEv()">Event save karo</button></p></div>`;
  h+=evTable(db.events.filter(e=>e.clubId==me.clubId));
 }else{
  h+=`<h1 style="font-size:32px">Main admin</h1><p class="mute">Clubs aur faculty ki detail yahan badlein.</p>`;
  h+=db.clubs.map(c=>`<div class="panel" style="border-left:6px solid ${c.color}"><div class="f">
  <div><label>Club ka naam</label><input id="c${c.id}_name" value="${esc(c.name)}"></div><div><label>Tag</label><input id="c${c.id}_tag" value="${esc(c.tag)}"></div>
  <div><label>Faculty ke naam (kai ho to comma se)</label><input id="c${c.id}_fname" value="${esc(c.fname)}"></div><div><label>Faculty ka number</label><input id="c${c.id}_fphone" value="${esc(c.fphone)}"></div>
  <div><label>Login username</label><input id="c${c.id}_fuser" value="${esc(c.fuser)}"></div><div><label>Login password</label><input id="c${c.id}_fpass" value="${esc(c.fpass)}"></div>
  <div style="grid-column:1/-1"><label>Intro</label><input id="c${c.id}_intro" value="${esc(c.intro)}"></div></div>
  <p style="margin-bottom:0"><button class="btn sm" onclick="saveClub(${c.id})">Save</button></p></div>`).join('');
  h+=evTable(db.events,true)+`<p><button class="btn red sm" onclick="if(confirm('Saara data demo data se badal jayega. Pakka?')){db=seed();save();go('dash')}">Demo data reset</button></p>`;
 }
 $('#app').innerHTML=h;
}
function evTable(list,all){
 return `<h2>${all?'Saare events':'Mere events'}</h2>`+(list.length?list.map(e=>{
  const rs=db.regs.filter(r=>r.eventId==e.id);
  return `<div class="panel"><div class="row"><div><h3>${esc(e.title)}</h3><small class="mute">${all?esc(club(e.clubId).name)+' · ':''}${fdate(e.date)} · ${rs.length}/${e.seats} registrations</small></div>
  <div><button class="btn sm ghost" onclick="csv(${e.id})">CSV download</button> <button class="btn sm" onclick="editM(${e.id})">Edit</button> <button class="btn sm red" onclick="delEv(${e.id})">Delete</button></div></div>
  ${!unl(e)?lockBox(e):rs.length?`<div class="scroll"><table><tr><th>Naam</th><th>Roll</th><th>Branch</th><th>Institute</th><th>Gender</th><th>Email</th><th>Phone</th><th>Team</th><th>Status</th><th>Action</th></tr>${rs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.roll)}</td><td>${esc(r.branch)}</td><td>${esc(r.inst)}</td><td>${esc(r.gender)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.team)}</td><td>${esc(stTxt(r.status))}</td><td><button class="btn sm" onclick="setReg(${r.id},'accepted')">Accept</button> <button class="btn sm red" onclick="setReg(${r.id},'cancelled')">Cancel</button></td></tr>`).join('')}</table></div>`:'<p class="mute" style="margin-bottom:0">Abhi koi registration nahi.</p>'}</div>`}).join(''):'<p class="mute">Abhi koi event nahi.</p>');
}
// Ownership check: faculty sirf apne club ka event badal sakta hai (admin sab)
const canEdit=e=>me&&(me.role==='admin'||(me.role==='faculty'&&e.clubId==me.clubId));
function addEv(){
 if(!me)return;
 const v=k=>$('#e_'+k).value.trim();
 const e={id:Date.now(),clubId:me.role==='admin'?parseInt(v('club')):me.clubId,img:tmp.ev||'',pw:v('pw'),title:v('title'),desc:v('desc'),note:v('note'),date:v('date'),time:v('time'),venue:v('venue'),last:v('last'),seats:parseInt(v('seats'))||0,type:v('type'),team:parseInt(v('team'))||1};
 if(!e.title||!e.date||!e.venue||!e.last||e.seats<1||!e.pw)return toast('Naam, date, venue, last date, seats aur event password bharein');
 db.events.push(e);save();tmp.ev=null;closeM();toast('Event jud gaya');dash();
}
function editM(id){
 const e=db.events.find(x=>x.id==id);
 if(!e||!canEdit(e))return toast('Aap dusre club ka event nahi badal sakte');
 const f=(k,l,t,v)=>`<div><label>${l}</label><input id="x_${k}" type="${t}" value="${esc(v)}"></div>`;
 modal(`<h2 style="margin-top:0">Event edit karo</h2><div class="f" style="grid-template-columns:1fr">`
 +f('title','Event ka naam','text',e.title)+f('date','Date','date',e.date)+f('time','Time','time',e.time)+f('venue','Venue','text',e.venue)+f('last','Registration last date','date',e.last)+f('seats','Seats','number',e.seats)
 +`<div><label>Type</label><select id="x_type"><option${e.type==='Solo'?' selected':''}>Solo</option><option${e.type==='Team'?' selected':''}>Team</option></select></div>`
 +f('team','Team me kitne members','number',e.team)
 +`<div><label>Activities</label><textarea id="x_desc" rows="3">${esc(e.desc)}</textarea></div>`+f('note','Kya laana hai / note','text',e.note||'')+f('pw','Event password','text',e.pw||'')
 +`</div><p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="saveEv(${id})">Save</button></p>`);
}
function saveEv(id){
 const e=db.events.find(x=>x.id==id);
 if(!e||!canEdit(e))return toast('Aap dusre club ka event nahi badal sakte');
 const v=k=>$('#x_'+k).value.trim(),seats=parseInt(v('seats'))||0;
 if(!v('title')||!v('date')||!v('venue')||!v('last'))return toast('Naam, date, venue aur last date bharein');
 if(seats<count(id))return toast('Seats '+count(id)+' se kam nahi ho sakti, itne log register ho chuke hain');
 Object.assign(e,{title:v('title'),date:v('date'),time:v('time'),venue:v('venue'),last:v('last'),seats,type:v('type'),team:parseInt(v('team'))||1,desc:v('desc'),note:v('note'),pw:v('pw')||e.pw});
 save();closeM();toast('Event update ho gaya');go('dash');
}
function delEv(id){
 const e=db.events.find(x=>x.id==id);
 if(!e||!canEdit(e))return toast('Aap dusre club ka event nahi badal sakte');
 if(!confirm('Event aur uski registrations delete ho jayengi. Pakka?'))return;
 db.events=db.events.filter(x=>x.id!=id);db.regs=db.regs.filter(r=>r.eventId!=id);save();dash();
}
function saveClub(id){
 if(!me||me.role!=='admin')return;
 const c=club(id);['name','tag','fname','fphone','fuser','fpass','intro'].forEach(k=>c[k]=$('#c'+id+'_'+k).value.trim());
 save();toast('Club save ho gaya');
}
function csv(id){
 const e=db.events.find(x=>x.id==id);if(!e||!canEdit(e))return;if(!unl(e))return toast('Pehle event ka password daalo');
 const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
 const rows=[['Naam','Roll','Branch','Institute','Gender','Email','Phone','Team','Status'],...db.regs.filter(r=>r.eventId==id).map(r=>[r.name,r.roll,r.branch,r.inst,r.gender,r.email,r.phone,r.team,stTxt(r.status)])];
 const blob=new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=e.title+'.csv';a.click();
}
go('home');
