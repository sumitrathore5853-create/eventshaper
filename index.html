<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventShaper</title>
<meta name="description" content="EventShaper — College Club Event Management, Malwa Institute of Science and Technology (MIST)">
<meta name="theme-color" content="#2B2F77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EventShaper">
<meta property="og:title" content="EventShaper — MIST College Club Events">
<meta property="og:description" content="Browse all 7 college clubs, upcoming events and register online.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F8;--card:#fff;--ink:#14182F;--mute:#5A6078;--line:#DDE1EB;--brand:#2B2F77;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1224;--card:#191D38;--ink:#EEF0FA;--mute:#A3A9C4;--line:#2B3157;--brand:#8E96FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1224;--card:#191D38;--ink:#EEF0FA;--mute:#A3A9C4;--line:#2B3157;--brand:#8E96FF;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;flex-wrap:wrap}
nav b{display:flex;align-items:center;gap:10px;font:800 22px 'Bricolage Grotesque',sans-serif;cursor:pointer}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:14px}.btn.red{background:#B3261E}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #F5B301;outline-offset:2px}
.banner{border-radius:22px;padding:44px 30px;margin:8px 0 28px;color:#fff;background:linear-gradient(120deg,#2B2F77,#B4235A 55%,#E8830C)}
.banner h1{font-size:clamp(32px,6vw,58px);font-weight:800}
.banner p{max-width:520px;margin:12px 0 0;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.club{background:var(--card);border-radius:16px;padding:18px;cursor:pointer;border:1px solid var(--line);border-top:6px solid var(--c)}
.hero{display:block;width:100%;height:auto;border-radius:22px;margin:8px 0 28px}
.logo{display:block;width:100%;height:110px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:10px}.logo.big{height:150px;max-width:300px}
.club h3{font-size:19px;margin:4px 0 4px}.club small,.mute{color:var(--mute)}
.club:hover{border-color:var(--c)}
h2{font-size:26px;margin:30px 0 14px}
.ev{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px;margin-bottom:12px}
.ev.hl{outline:3px solid var(--brand);outline-offset:2px;box-shadow:0 8px 28px #0002}
.notice{background:linear-gradient(90deg,#FFF8E1,#FFF3CD);color:#14182F;border:1.5px solid #F5B301;border-left:6px solid #E8830C;border-radius:14px;padding:13px 16px;margin:8px 0 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
:root[data-theme="dark"] .notice{background:#2A2310;color:#EEF0FA;border-color:#C89B27}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .notice{background:#2A2310;color:#EEF0FA;border-color:#C89B27}}
.winbox{background:var(--bg);border:1.5px solid #F5B301;border-radius:12px;padding:10px 13px;margin:8px 0}
.role-card{background:var(--card);border:1.5px solid var(--line);border-top:6px solid var(--rc);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transition:transform .15s,box-shadow .15s}.role-card:hover{transform:translateY(-2px);border-color:var(--rc);box-shadow:0 10px 26px #0001}
.ev h3{font-size:19px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:6px 6px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg)}
.modal{position:fixed;inset:0;background:#000A;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:20}
.modal .box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:480px;margin:auto}
.toast{max-width:90vw;width:max-content;text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-weight:700}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
footer{padding:30px 0 40px;color:var(--mute);font-size:14px}
body{font-family:'DM Sans','Noto Sans Devanagari',system-ui,sans-serif}h1,h2,h3{font-family:'Bricolage Grotesque','Noto Sans Devanagari',system-ui,sans-serif}</style>
</head>

async function act(fn){if(busyF)return;busyF=true;try{await fn()}catch(e){toast(e.message||'Kuch gadbad ho gayi')}finally{busyF=false}}
async function sb(path,o={}){
 const h={apikey:KEY,Authorization:'Bearer '+(tok||KEY)};
 if(o.body!==undefined)h['Content-Type']='application/json';
 if(o.rep)h.Prefer='return=representation';
 const r=await fetch(SB+path,{method:o.m||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description))||('Error '+r.status));
 return j;
}
const rpc=(n,b)=>sb('/rest/v1/rpc/'+n,{m:'POST',body:b||{}});
const packIntro=(intro,nt)=>String(intro||'').trim()+(nt&&String(nt).trim()?`\n[[NOTICE:${String(nt).trim().replace(/\]\]/g,'')}]]`:'');
const packNote=(note,w)=>{const a=(w||[]).map(x=>String(x||'').replace(/[|\]]/g,' ').trim());return String(note||'').trim()+(a.some(Boolean)?`\n[[WIN:${a[0]||''}|${a[1]||''}|${a[2]||''}]]`:'')};
const mapC=c=>{const raw=c.intro||'',nm=raw.match(/\n?\[\[NOTICE:([\s\S]*?)\]\]$/);return {id:c.id,name:c.name,tag:c.tag||'',intro:raw.replace(/\n?\[\[NOTICE:[\s\S]*?\]\]$/,'').trim(), _nt:nm?nm[1].trim():'',color:c.color||'#2B2F77',fname:c.faculty_name||'',fphone:c.faculty_phone||'',logo:c.logo||''}};
const mapE=e=>{const raw=e.note||'',wm=raw.match(/\n?\[\[WIN:([^\]]*)\]\]$/),w=wm?wm[1].split('|').map(x=>x.trim()):['','',''];while(w.length<3)w.push('');return {id:e.id,clubId:e.club_id,title:e.title,desc:e.description||'',note:raw.replace(/\n?\[\[WIN:[^\]]*\]\]$/,'').trim(),win:w.slice(0,3),date:e.event_date,time:(e.start_time||'').slice(0,5),end:(e.end_time||'').slice(0,5),venue:e.venue||'',last:e.last_date||'',seats:e.seats,type:e.type,team:e.team_size||1,img:e.image||'',created:e.created_at||''}};
async function load(){
 const [c,e,g,s,m]=await Promise.all([sb('/rest/v1/clubs?select=*&order=id'),sb('/rest/v1/events?select=*&order=event_date,start_time'),sb('/rest/v1/gallery?select=*&order=id'),rpc('seat_counts'),rpc('member_counts')]);
 db.clubs=c.map(mapC);db.notice=(db.clubs[0]&&db.clubs[0]._nt)||'';db.events=e.map(mapE);db.gal=g;taken={};s.forEach(x=>taken[x.event_id]=+x.taken);mem={};m.forEach(x=>mem[x.club_id]=+x.total);
}

 };

 modal(`<h2 style="margin-top:0">Faculty accounts</h2><div class="panel"><b>Naya faculty account</b><div class="f" style="grid-template-columns:1fr;margin-top:10px">${fld('nf_user','Username','text','','jaise: dance')}${fld('nf_pass','Password (min 6)','text')}<div><label>Club</label><select id="nf_club">${db.clubs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div><p style="margin:10px 0 0"><button class="btn sm" onclick="act(addFac)">Account banao</button></p></div>`
 +F.map(f=>`<div class="panel"><b>${esc(f.club_name)}</b> <span class="mute">(${esc(uname(f.email))})</span><p style="margin:6px 0">${f.pw_changed_at?`<span>Password faculty ne badla:</span> <b>${esc(new Date(f.pw_changed_at).toLocaleString(lang==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true}))}</b>`:f.temp_password?`<span>Temporary password:</span> <b>${esc(f.temp_password)}</b> <span>(faculty ne abhi nahi badla)</span>`:'<span>Password admin ko nahi pata. Naya set karo.</span>'}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="pw_${f.user_id}" type="text" autocomplete="off" placeholder="Naya password (min 6)" style="flex:1;min-width:150px"><button class="btn sm" onclick="act(()=>setPw('${f.user_id}'))">Password badlo</button></div></div>`).join('')
 +`<p style="text-align:right"><button class="btn" onclick="closeM()">Done</button></p>`);
}
async function setPw(uid){
 const v=$('#pw_'+uid).value;
 if(v.length<6)return toast('Password kam se kam 6 akshar ka hona chahiye');
 const r=await rpc('admin_set_faculty_password',{p_user:uid,p_password:v});
 if(r!=='ok')return toast(r);
 toast('Password badal gaya');await facM();
}
async function addFac(){
 const u=$('#nf_user').value.trim().toLowerCase(),p=$('#nf_pass').value;
 if(!/^[a-z0-9._-]{3,}$/.test(u))return toast('Username me sirf chhote akshar, number aur . _ - ho sakte hain (kam se kam 3)');
 if(p.length<6)return toast('Password kam se kam 6 akshar ka hona chahiye');
 const r=await rpc('admin_create_faculty',{p_email:u+'@eventshaper.app',p_password:p,p_club:+$('#nf_club').value});
 if(r!=='ok')return toast(r);
 toast('Faculty account ban gaya');await facM();
}
function myPwM(){
 modal(`<h2 style="margin-top:0">Mera password</h2><p class="mute">Password hamesha chhupa rehta hai, isliye purana yahan nahi dikhta. Naya password chuno.</p><div class="f" style="grid-template-columns:1fr">${fld('mp_a','Naya password (min 6)','password')}${fld('mp_b','Naya password dobara','password')}<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" style="width:auto" onchange="$('#mp_a').type=$('#mp_b').type=this.checked?'text':'password'"> Show password</label></div><p class="row" style="margin-bottom:0"><button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn" onclick="act(savePw)">Password badlo</button></p>`);
}
async function savePw(){
 const a=$('#mp_a').value,b=$('#mp_b').value;
 if(a.length<6)return toast('Password kam se kam 6 akshar ka hona chahiye');
 if(a!==b)return toast('Dono password alag hain');
 await sb('/auth/v1/user',{m:'PUT',body:{password:a}});
 await rpc('faculty_password_changed');
 closeM();toast('Aapka password badal gaya');
}
function logoM(){
 tmp.lg={};
 modal(`<h2 style="margin-top:0">Club logos</h2>`+db.clubs.map(c=>`<div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${logo(c)?`<div style="width:110px">${logo(c)}</div>`:'<div class="mute" style="width:110px">Logo nahi hai</div>'}<div style="flex:1;min-width:160px"><b>${esc(c.name)}</b><br><input type="file" accept="image/*" onchange="pickLogo(this,${c.id})"></div><button class="btn sm" onclick="act(()=>saveLogo(${c.id}))">Save</button></div>`).join('')+`<p style="text-align:right"><button class="btn" onclick="closeM()">Done</button></p>`);
}
async function pickLogo(inp,id){tmp.lg=tmp.lg||{};tmp.lg[id]=inp.files[0]?await readImg(inp.files[0],500):null;toast(tmp.lg[id]?'Logo chun liya':'File nahi mili')}
async function saveLogo(id){
 const b=(tmp.lg||{})[id];if(!b)return toast('Pehle logo ki file chuno');
 await sb('/rest/v1/clubs?id=eq.'+id,{m:'PATCH',body:{logo:await upload(b,'logos')}});
 delete tmp.lg[id];await load();toast('Logo badal gaya');logoM();
}
async function addClub(){
 const v=k=>$('#n_'+k).value.trim();if(!v('name'))return toast('Club ka naam bharein');
 await sb('/rest/v1/clubs',{m:'POST',body:{name:v('name'),tag:v('tag'),intro:v('intro'),color:v('color'),faculty_name:v('fname')||'Details jald aayengi',faculty_phone:v('fphone'),logo:(tmp.lg||{})[0]?await upload(tmp.lg[0],'logos'):null}});
 await load();closeM();toast('Naya club ban gaya');go('home');
}

function tr(s){
 const i=lang==='hi'?1:0;
 if(MAP[s])return MAP[s][i];
 for(const p of PRE)if(s.startsWith(p[0]))return (i?p[2]:p[1])+s.slice(p[0].length);
 for(const q of PAT){const m=s.match(q[0]);if(m)return q[1](...m.slice(1))[i]}
 return s;
}
function tx(n){
 if(n.nodeType===3){const v=n.nodeValue,t=v.trim();if(t){const r=tr(t);if(r!==t)n.nodeValue=v.replace(t,r)}return}
 if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
 if(n.placeholder){const r=tr(n.placeholder);if(r!==n.placeholder)n.placeholder=r}
 n.childNodes.forEach(c=>tx(c));
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(tx))).observe(document.body,{childList:true,subtree:true});
function toggleLang(){setLang(lang==='hi'?'en':'hi')}
